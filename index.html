<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1626">
<title>ГЕОС · Наука за окном</title>
<meta name="description" content="ГЕОС: поездка на автобусе 17а превращается в маленькое исследование Великого Новгорода.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Unbounded;font-weight:500;font-display:swap;src:url(fonts/unbounded-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Unbounded;font-weight:500;font-display:swap;src:url(fonts/unbounded-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-03FF,U+2000-206F,U+20AC,U+2116,U+2190-21FF}
@font-face{font-family:Unbounded;font-weight:700;font-display:swap;src:url(fonts/unbounded-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Unbounded;font-weight:700;font-display:swap;src:url(fonts/unbounded-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-03FF,U+2000-206F,U+20AC,U+2116,U+2190-21FF}
@font-face{font-family:Manrope;font-weight:400;font-display:swap;src:url(fonts/manrope-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Manrope;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-03FF,U+2000-206F,U+20AC,U+2116,U+2190-21FF}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-03FF,U+2000-206F,U+20AC,U+2116,U+2190-21FF}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(fonts/manrope-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-03FF,U+2000-206F,U+20AC,U+2116,U+2190-21FF}

:root{--bg:#0E1626;--s1:#17233A;--s2:#20304C;--tx:#F3F5F9;--mu:#93A1B8;--so:#C9D2E1;--pr:#FF6A3D;--te:#2EC4B6;--am:#FFB547;--seg:#2EC4B6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.u{font-family:Unbounded,Manrope,sans-serif}
#app{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));min-height:100dvh;position:relative}
.screen{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.brand{display:flex;gap:10px;align-items:center}
.gbox{background:var(--tx);border-radius:11px;padding:2px;width:36px;height:36px;display:block}
.eyebrow{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:1.2px;text-transform:uppercase}
.link{font-size:13px;font-weight:700;color:var(--mu);padding:8px 0}
.h1{font-size:27px;font-weight:700;line-height:1.18;margin-top:22px}
.lead{font-size:15px;color:var(--so);margin-top:8px}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:24px;padding:18px;margin-top:16px}
.pill{font-size:10px;font-weight:800;color:var(--am);border:1px solid var(--am);border-radius:999px;padding:3px 8px;letter-spacing:.5px}
.num{background:var(--pr);border-radius:12px;padding:8px 10px;color:var(--bg);font-size:18px;font-weight:700}
.row{display:flex;gap:12px;align-items:center}
.btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 40px);max-width:440px;background:var(--pr);color:var(--bg);border-radius:18px;text-align:center;padding:17px;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(255,106,61,.35);z-index:5;transition:transform .15s}
.btn:active{transform:translateX(-50%) scale(.97)}
.btn.ghost{background:var(--s1);border:1px solid var(--s2);color:var(--tx);box-shadow:none}
.btn[disabled]{opacity:.45}
.tiles{display:flex;gap:10px;margin-top:12px}
.tile{flex:1;background:var(--s1);border-radius:18px;padding:12px}
.tile p{font-size:11.5px;color:var(--so);margin-top:4px;line-height:1.3}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--s1);border-radius:18px;padding:13px 14px;margin-top:10px;width:100%}
.bar.dash{border:1px dashed var(--s2)}
.plaque{background:linear-gradient(135deg,#2EC4B6,#5B8DEF);color:var(--bg);border-radius:18px;padding:14px;margin-top:14px;width:100%}

/* мини-линия */
.line{display:flex;align-items:center;margin-top:14px}
.line i{flex:1;height:6px;opacity:.35}
.line i.on{opacity:1}
.line b{width:14px;height:14px;border-radius:50%;background:var(--s1);border:3px solid var(--mu);flex:none}
.line b.on{border-color:var(--tx)}

/* выбор остановки */
.stop{display:flex;gap:14px;align-items:center;width:100%;padding:13px 14px;border-radius:16px;background:var(--s1);margin-top:8px;border:2px solid transparent;transition:border-color .15s}
.stop.sel{border-color:var(--pr);background:rgba(255,106,61,.1)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* поездка */
.hero{margin-top:14px;border-radius:26px;padding:20px;color:var(--bg);position:relative;overflow:hidden;background:var(--seg)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .ic{position:absolute;right:16px;top:14px;font-size:34px;z-index:1}
.hero .t{font-size:24px;font-weight:700;line-height:1.15;margin-top:10px;padding-right:40px}
.hero .look{font-size:14px;font-weight:700;margin-top:10px}
.hero .open{margin-top:16px;background:var(--bg);color:var(--tx);border-radius:14px;padding:13px;text-align:center;font-weight:800;font-size:15px;width:100%;display:block}
.hero .done{margin-top:16px;background:rgba(14,22,38,.18);border-radius:14px;padding:12px;font-weight:800;font-size:14px;text-align:center}
.tl{margin-top:20px}
.tli{display:flex;gap:14px;align-items:flex-start;position:relative;min-height:54px}
.tli .ln{position:absolute;left:8px;top:18px;width:4px;height:42px}
.tli .nd{width:20px;height:20px;border-radius:50%;flex:none;border:4px solid var(--tx);position:relative;z-index:1}
.tli .nm{font-size:14px;font-weight:600}
.tli .sb{font-size:12px;color:var(--mu)}
.pulse{box-shadow:0 0 0 6px rgba(255,106,61,.25);animation:pl 1.6s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 4px rgba(255,106,61,.35)}50%{box-shadow:0 0 0 10px rgba(255,106,61,.08)}}

/* карточка */
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;padding:5px 10px;border-radius:999px;color:var(--bg);background:var(--seg)}
.story{font-size:16px;line-height:1.55;color:var(--so);margin-top:12px}
.lookbox{margin-top:14px;border-radius:16px;padding:12px 14px;background:var(--s1);border-left:4px solid var(--seg);font-size:14px;font-weight:700}
.q{font-size:18px;font-weight:800;margin-top:20px;line-height:1.35}
.opt{margin-top:9px;padding:14px;border-radius:14px;background:var(--s1);border:2px solid transparent;font-size:15px;font-weight:600;display:flex;gap:10px;line-height:1.35;width:100%;transition:all .15s}
.opt:active{transform:scale(.98)}
.opt .m{color:var(--mu);flex:none}
.opt.ok{background:rgba(46,196,182,.14);border-color:var(--te);font-weight:800}
.opt.ok .m{color:var(--te)}
.opt.bad{background:rgba(255,106,61,.12);border-color:var(--pr)}
.opt.bad .m{color:var(--pr)}
.opt.pick{background:rgba(201,125,255,.14);border-color:#C77DFF;font-weight:800}
.opt.dim{opacity:.55}
.expl{margin-top:12px;background:var(--s1);border-left:4px solid var(--te);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--so);animation:in .3s ease both}
.expl b{color:var(--te)}
.expl.bad{border-color:var(--pr)}
.expl.bad b{color:var(--pr)}
.qdots{display:flex;gap:6px}
.qdots i{width:22px;height:5px;border-radius:3px;background:var(--s2)}
.qdots i.on{background:var(--seg)}
.draft{font-size:11px;color:var(--am);margin-top:8px;font-weight:700}

/* гусь */
.goose{display:flex;gap:12px;align-items:flex-end;margin-top:16px;animation:in .35s ease both}
.goose img{width:58px;height:58px;background:var(--tx);border-radius:18px;padding:4px;flex:none;animation:bob 2.4s ease-in-out infinite}
.goose .say{background:var(--s2);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14px;font-weight:600;position:relative}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.goose img.hop{animation:hop .5s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-8deg)}100%{transform:translateY(0)}}

/* бейдж */
.badge{margin-top:16px;background:var(--s2);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.bi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;background:var(--seg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gc{background:var(--s1);border-radius:16px;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--so);line-height:1.25}
.gc .bi{margin:0 auto 6px;width:40px;height:40px;font-size:20px}
.gc.lock{color:var(--mu)}
.gc.lock .bi{background:var(--s2)!important;filter:grayscale(1);opacity:.5}

/* финал */
.stat{flex:1;background:var(--s1);border-radius:18px;padding:14px;text-align:center}
.stat .u{font-size:28px;font-weight:700}
.stat p{font-size:12px;color:var(--mu)}
.chain{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:14px;color:var(--so)}
.chain i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* дневник */
.di{background:var(--s1);border-radius:16px;padding:12px 14px;margin-top:8px;border-left:4px solid var(--seg)}
.di p{font-size:14px}
.di small{font-size:12px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));max-width:340px;text-align:center;transform:translateX(-50%);background:var(--s2);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;z-index:10;animation:in .3s ease both}
.prog{height:4px;background:var(--s2);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pr);border-radius:2px;transition:width .5s}
a{color:var(--te)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:20px">Для ГЕОС нужен JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
